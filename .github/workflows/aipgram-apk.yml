name: AIPGram APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Apply AIPGram configuration
        run: node aipgram/apply.js

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew :TMessagesProj_App:assembleAfatRelease --no-daemon --stacktrace "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g"

      - uses: actions/upload-artifact@v4
        with:
          name: aipgram-android-apk
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: error
